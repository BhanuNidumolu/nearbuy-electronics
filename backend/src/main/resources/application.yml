server:
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nearbuy}
    username: ${SPRING_DATASOURCE_USERNAME:nearbuy}
    password: ${SPRING_DATASOURCE_PASSWORD:nearbuy-local-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
  jackson:
    default-property-inclusion: non_null
app:
  jwt-secret: ${JWT_SECRET:local-only-change-this-secret-before-deploying-123456}
  reservation-hold-duration: ${RESERVATION_HOLD_DURATION:PT15M}
